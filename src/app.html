<!doctype html>
<html lang="en">
	<head>
		<!-- Character Encoding -->
		<meta charset="utf-8" />

		<!-- Responsive Viewport Configuration -->
		<meta name="viewport" content="width=device-width, initial-scale=1" />

		<!-- Theme Color for Mobile Browsers -->
		<meta name="theme-color" content="#ff9e00" />

		<!-- Favicon -->
		<link rel="icon" href="%sveltekit.assets%/Favicon.svg" />

		<!-- Warm the connection the pixel needs before it is requested -->
		<link rel="preconnect" href="https://connect.facebook.net" crossorigin />

		<!-- Meta Pixel Code -->
		<!-- Loaded from a file so the CSP can omit 'unsafe-inline' for scripts. -->
		<script src="%sveltekit.assets%/meta-pixel.js" defer></script>
		<noscript>
			<img
				height="1"
				width="1"
				style="display: none"
				alt=""
				src="https://www.facebook.com/tr?id=2682287902136321&ev=PageView&noscript=1"
			/>
		</noscript>
		<!-- End Meta Pixel Code -->

		<!-- SvelteKit Head Injection Point -->
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover" class="bg-white dark:bg-stone-900">
		<!-- SvelteKit Body Injection Point -->
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
