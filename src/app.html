<!doctype html>
<html lang="en">
	<head>
		<!-- Character Encoding -->
		<meta charset="utf-8" />

		<!-- Responsive Viewport Configuration -->
		<meta name="viewport" content="width=device-width, initial-scale=1" />

		<!-- Theme Color for Mobile Browsers -->
		<meta name="theme-color" content="#27251f" />

		<!-- Favicon -->
		<link rel="icon" href="%sveltekit.assets%/Favicon.svg" />

		<!-- RSS Feed Discovery -->
		<link
			rel="alternate"
			type="application/rss+xml"
			title="Alex Vaughan — Writing"
			href="/rss.xml"
		/>

		<!-- SvelteKit Head Injection Point -->
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover" class="bg-white dark:bg-stone-900">
		<!-- SvelteKit Body Injection Point -->
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
